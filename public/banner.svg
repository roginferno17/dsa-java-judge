<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Orange/Gold Accent Gradient -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Pulse -->
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes wave-flow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
      .glowing-orb-1 {
        animation: pulse-glow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glowing-orb-2 {
        animation: pulse-glow 8s ease-in-out infinite 2s;
        transform-origin: 1000px 200px;
      }
      .chip {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="20" fill="url(#bg-gradient)" />
  <rect width="1200" height="300" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Background Glowing Ambient Orbs -->
  <circle cx="200" cy="90" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="glowing-orb-1" />
  <circle cx="1000" cy="200" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="glowing-orb-2" />
  <circle cx="600" cy="150" r="180" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Modern Dot Grid -->
  <g opacity="0.12" fill="#94a3b8">
    <circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="200" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="400" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/><circle cx="500" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/><circle cx="600" cy="50" r="1.5"/><circle cx="650" cy="50" r="1.5"/><circle cx="700" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/><circle cx="800" cy="50" r="1.5"/><circle cx="850" cy="50" r="1.5"/><circle cx="900" cy="50" r="1.5"/><circle cx="950" cy="50" r="1.5"/><circle cx="1000" cy="50" r="1.5"/><circle cx="1050" cy="50" r="1.5"/><circle cx="1100" cy="50" r="1.5"/>
    <circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="250" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="350" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="450" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="550" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="650" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/><circle cx="750" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="850" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/><circle cx="950" cy="100" r="1.5"/><circle cx="1000" cy="100" r="1.5"/><circle cx="1050" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/>
    <circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="200" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="300" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="400" cy="150" r="1.5"/><circle cx="450" cy="150" r="1.5"/><circle cx="500" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/><circle cx="600" cy="150" r="1.5"/><circle cx="650" cy="150" r="1.5"/><circle cx="700" cy="150" r="1.5"/><circle cx="750" cy="150" r="1.5"/><circle cx="800" cy="150" r="1.5"/><circle cx="850" cy="150" r="1.5"/><circle cx="900" cy="150" r="1.5"/><circle cx="950" cy="150" r="1.5"/><circle cx="1000" cy="150" r="1.5"/><circle cx="1050" cy="150" r="1.5"/><circle cx="1100" cy="150" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="150" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="250" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="350" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="450" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="550" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/><circle cx="650" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/><circle cx="750" cy="200" r="1.5"/><circle cx="800" cy="200" r="1.5"/><circle cx="850" cy="200" r="1.5"/><circle cx="900" cy="200" r="1.5"/><circle cx="950" cy="200" r="1.5"/><circle cx="1000" cy="200" r="1.5"/><circle cx="1050" cy="200" r="1.5"/><circle cx="1100" cy="200" r="1.5"/>
    <circle cx="100" cy="250" r="1.5"/><circle cx="150" cy="250" r="1.5"/><circle cx="200" cy="250" r="1.5"/><circle cx="250" cy="250" r="1.5"/><circle cx="300" cy="250" r="1.5"/><circle cx="350" cy="250" r="1.5"/><circle cx="400" cy="250" r="1.5"/><circle cx="450" cy="250" r="1.5"/><circle cx="500" cy="250" r="1.5"/><circle cx="550" cy="250" r="1.5"/><circle cx="600" cy="250" r="1.5"/><circle cx="650" cy="250" r="1.5"/><circle cx="700" cy="250" r="1.5"/><circle cx="750" cy="250" r="1.5"/><circle cx="800" cy="250" r="1.5"/><circle cx="850" cy="250" r="1.5"/><circle cx="900" cy="250" r="1.5"/><circle cx="950" cy="250" r="1.5"/><circle cx="1000" cy="250" r="1.5"/><circle cx="1050" cy="250" r="1.5"/><circle cx="1100" cy="250" r="1.5"/>
  </g>

  <!-- Decorative Java Code Syntax Watermark -->
  <g font-family="Consolas, monospace" font-size="13" fill="#334155" opacity="0.4" font-weight="600">
    <text x="60" y="80">class Solution {</text>
    <text x="80" y="105">public int[] twoSum(int[] nums, int target) {</text>
    <text x="100" y="130">Map&lt;Integer, Integer&gt; map = new HashMap&lt;&gt;();</text>
    <text x="100" y="155">for (int i = 0; i &lt; nums.length; i++) {</text>
    <text x="120" y="180">int complement = target - nums[i];</text>
    <text x="80" y="205">}</text>
    <text x="60" y="230">}</text>
  </g>

  <!-- Left Icon: Glowing Java + LeetCode Hexagon -->
  <g transform="translate(180, 150)">
    <!-- Outer Glow -->
    <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="none" stroke="url(#title-gradient)" stroke-width="3" filter="url(#soft-glow)" opacity="0.9" />
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Java Coffee Cup Glyph -->
    <path d="M-14,8 C-14,18 14,18 14,8 L14,-6 L-14,-6 Z M14,-2 C18,-2 21,0 21,3 C21,6 18,8 14,8 M-18,19 L18,19" fill="none" stroke="url(#accent-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-6,-11 C-3,-16 -9,-20 -5,-25 M0,-11 C3,-16 -3,-20 1,-25 M6,-11 C9,-16 3,-20 7,-25" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Main Titles -->
  <!-- Top Super-header -->
  <g transform="translate(280, 85)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">STRIVER A2Z DSA JUDGE</text>
  </g>

  <!-- Main Glowing Brand Title -->
  <text x="280" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="52" font-weight="900" fill="url(#title-gradient)" letter-spacing="-1">
    DSA JAVA JUDGE
  </text>

  <!-- Subtitle -->
  <text x="282" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    True LeetCode-Style Method Execution Platform • Striver A2Z DSA Curriculum
  </text>

  <!-- Feature Badge Chips Row -->
  <g transform="translate(280, 215)">
    <!-- Chip 1: 474 Problems -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
      <text x="14" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#60A5FA">📚 474 Problems</text>
    </g>

    <!-- Chip 2: Zero Scanner -->
    <g transform="translate(142, 0)">
      <rect width="130" height="28" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
      <text x="14" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#A78BFA">⚡ Zero Scanner</text>
    </g>

    <!-- Chip 3: 100% Offline Sync -->
    <g transform="translate(284, 0)">
      <rect width="150" height="28" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
      <text x="14" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#34D399">💾 Offline Disk Sync</text>
    </g>

    <!-- Chip 4: Java 21 -->
    <g transform="translate(446, 0)">
      <rect width="115" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
      <text x="14" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FBBF24">☕ Java 17/21</text>
    </g>

    <!-- Chip 5: 18 Steps -->
    <g transform="translate(573, 0)">
      <rect width="115" height="28" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
      <text x="14" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#F472B6">🗺️ 18 Steps</text>
    </g>
  </g>
</svg>
